<!DOCTYPE html>

<body>
    <header>
        <h1>Ajouter un Livre à La Maison du Livre</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="livres.html">Nos Livres</a></li>
                <li><a href="abonnements.html">Abonnements</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <h2>Formulaire d'Ajout de Livre</h2>
        <form action="ajouter_livre_admin.php" method="POST">
            <label for="titre">Titre :</label>
            <input type="text" id="titre" name="titre" required><br><br>

            <label for="auteur">Auteur :</label>
            <input type="text" id="auteur" name="auteur" required><br><br>

            <label for="genre">Genre :</label>
            <input type="text" id="genre" name="genre"><br><br>

            <label for="quantité_disponible">Quantité disponible :</label>
            <input type="number" id="quantité_disponible" name="quantité_disponible" required><br><br>

            <button type="submit">Ajouter</button>
        </form>
    </main>
